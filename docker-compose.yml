services:
  postgres:
    image: postgres:16-alpine
    container_name: capital_pg
    environment:
      POSTGRES_USER: capital
      POSTGRES_PASSWORD: capital
      POSTGRES_DB: capital
    ports:
      - "5432:5432"
    volumes:
      - capital_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  capital_pg:
